name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore SiaWebhookApi.slnx

      - name: Build .NET
        run: dotnet build SiaWebhookApi.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test SiaWebhookApi.Tests/SiaWebhookApi.Tests.csproj --configuration Release --no-build

      - name: Install web dependencies
        working-directory: webapp
        run: npm ci

      - name: Lint webapp
        working-directory: webapp
        run: npm run lint

      - name: Build webapp
        working-directory: webapp
        run: npm run build
